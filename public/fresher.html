<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fresher Registration | IT Work Portal</title><link rel="stylesheet" href="style.css"></head>
<body class="app-page"><header class="app-header"><a class="brand brand-light" href="dashboard.html"><span class="brand-mark">IT</span> Work Portal</a><nav class="app-nav"><a href="dashboard.html">Dashboard</a><a href="profile.html">My Profile</a></nav></header>
<main class="form-page container"><a class="back-link" href="dashboard.html">← Back to dashboard</a><div class="page-heading"><p class="eyebrow">Fresher opportunity</p><h1>Tell us about your potential</h1><p class="muted">Complete your profile so we can understand the work you want to begin.</p></div>
<form class="work-form" id="fresher-form" data-endpoint="/api/fresher" novalidate><h2>Personal Information</h2><div class="form-grid"><div><label for="fullName">Full Name</label><input id="fullName" name="fullName" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" required></div><div><label for="phone">Phone Number</label><input id="phone" name="phone" required></div><div><label for="dateOfBirth">Date of Birth</label><input id="dateOfBirth" name="dateOfBirth" type="date"></div><div><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label for="location">Location</label><input id="location" name="location" required></div></div><h2>Education and Skills</h2><div class="form-grid"><div><label for="qualification">Highest Qualification</label><input id="qualification" name="qualification" required></div><div><label for="college">College / University</label><input id="college" name="college"></div><div><label for="graduationYear">Graduation Year</label><input id="graduationYear" name="graduationYear" type="number"></div><div><label for="skills">Programming and Technical Skills</label><input id="skills" name="skills" placeholder="JavaScript, SQL, HTML"></div><div><label for="certifications">Certifications</label><input id="certifications" name="certifications"></div></div><h2>IT Work Preference</h2><div class="form-grid"><div><label for="workType">Preferred IT Work Type</label><select id="workType" name="workType" required></select></div><div><label for="preferredLocation">Preferred Location</label><input id="preferredLocation" name="preferredLocation"></div><div><label for="expectedSalary">Expected Salary</label><input id="expectedSalary" name="expectedSalary" type="number"></div><div><label for="workMode">Work Type</label><select id="workMode" name="workMode"><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Remote</option><option>Hybrid</option></select></div></div><button class="button" type="submit">Submit Application</button><p class="form-message" id="form-message" role="status"></p></form></main><script src="work.js"></script></body></html>
