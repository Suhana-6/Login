<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Experienced Registration | IT Work Portal</title><link rel="stylesheet" href="style.css"></head>
<body class="app-page"><header class="app-header"><a class="brand brand-light" href="dashboard.html"><span class="brand-mark">IT</span> Work Portal</a><nav class="app-nav"><a href="dashboard.html">Dashboard</a><a href="profile.html">My Profile</a></nav></header>
<main class="form-page container"><a class="back-link" href="dashboard.html">← Back to dashboard</a><div class="page-heading"><p class="eyebrow">Experienced opportunity</p><h1>Showcase your experience</h1><p class="muted">Share the details employers need to understand your professional strengths.</p></div>
<form class="work-form" id="experienced-form" data-endpoint="/api/experienced" novalidate><h2>Personal Information</h2><div class="form-grid"><div><label for="fullName">Full Name</label><input id="fullName" name="fullName" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" required></div><div><label for="phone">Phone</label><input id="phone" name="phone" required></div><div><label for="location">Location</label><input id="location" name="location" required></div></div><h2>Professional Information</h2><div class="form-grid"><div><label for="experienceYears">Total Experience (years)</label><input id="experienceYears" name="experienceYears" type="number" min="0" step="0.5" required></div><div><label for="currentCompany">Current Company</label><input id="currentCompany" name="currentCompany"></div><div><label for="previousCompany">Previous Company</label><input id="previousCompany" name="previousCompany"></div><div><label for="currentDesignation">Current Designation</label><input id="currentDesignation" name="currentDesignation"></div><div><label for="previousDesignation">Previous Designation</label><input id="previousDesignation" name="previousDesignation"></div></div><h2>Skills and Preference</h2><div class="form-grid"><div><label for="primarySkill">Primary Skill</label><input id="primarySkill" name="primarySkill" required></div><div><label for="secondarySkills">Secondary Skills</label><input id="secondarySkills" name="secondarySkills"></div><div><label for="programmingLanguages">Programming Languages</label><input id="programmingLanguages" name="programmingLanguages"></div><div><label for="tools">Tools / Technologies</label><input id="tools" name="tools"></div><div><label for="certifications">Certifications</label><input id="certifications" name="certifications"></div><div><label for="workType">IT Work Type</label><select id="workType" name="workType" required></select></div><div><label for="expectedSalary">Expected Salary</label><input id="expectedSalary" name="expectedSalary" type="number"></div><div><label for="noticePeriod">Notice Period</label><input id="noticePeriod" name="noticePeriod"></div><div><label for="preferredLocation">Preferred Location</label><input id="preferredLocation" name="preferredLocation"></div><div><label for="workMode">Work Type</label><select id="workMode" name="workMode"><option>Full Time</option><option>Part Time</option><option>Remote</option><option>Hybrid</option></select></div></div><button class="button" type="submit">Submit Application</button><p class="form-message" id="form-message" role="status"></p></form></main><script src="work.js"></script></body></html>
