<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IT Work Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-intro"><a class="brand brand-light" href="/"><span class="brand-mark">IT</span> Work Portal</a><p class="eyebrow">Build your professional future</p><h1>Start Your IT Journey</h1><p>Create your account and explore IT opportunities that match your skills and career goals.</p></section>
        <section class="auth-card auth-card-wide"><p class="eyebrow">New account</p><h2>Create Your Account</h2><p class="muted">Create an account to access IT work opportunities.</p>
            <form id="register-form" novalidate>
                <div class="form-grid"><div><label for="fullName">Full Name</label><input id="fullName" name="fullName" type="text" placeholder="Your full name"><p class="field-error" id="fullName-error"></p></div><div><label for="username">Username</label><input id="username" name="username" type="text" placeholder="Choose a username"><p class="field-error" id="username-error"></p></div><div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com"><p class="field-error" id="email-error"></p></div><div><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 6 characters"><p class="field-error" id="password-error"></p></div><div><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat your password"><p class="field-error" id="confirmPassword-error"></p></div></div>
                <button class="button button-full" id="register-button" type="submit">Create Account</button><p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
    <script src="/js/register.js"></script>
</body>
</html>
