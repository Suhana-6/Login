<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | IT Work Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="login-card">
        <div class="logo-wrap">
          <div class="logo">IT</div>
          <span>IT Work Portal</span>
        </div>

        <div class="header-text">
          <p class="small-title">Welcome Back</p>
          <h1>Login to continue</h1>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Username or Email</label>
            <input type="text" id="email" name="email" placeholder="Enter your email or username" />
            <small class="error-message" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" />
              <button type="button" id="togglePassword" class="toggle-btn">Show</button>
            </div>
            <small class="error-message" id="passwordError"></small>
          </div>

          <div class="extra-row">
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Login</button>

          <p id="formMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="bottom-text">
          Don’t have an account?
          <a href="#">Register Now</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
