<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresher Application | IT Work Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-mark">IT</span>
        <span>IT Work Portal</span>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html">Home</a>
        <a href="profile.html">My Profile</a>
        <a href="fresher.html" class="active">Fresher</a>
        <a href="experienced.html">Experienced</a>
        <button id="logout-button" class="nav-btn" type="button">Logout</button>
      </nav>
    </header>

    <main class="container form-wrap">
      <h2>Fresher Application Form</h2>
      <form id="fresher-form" novalidate>
        <div class="form-grid">
          <h3 class="form-section-title">Personal Information</h3>
          <div class="field">
            <label for="fresher-full-name">Full Name <span class="required-mark">*</span></label>
            <input id="fresher-full-name" type="text" name="full_name" required />
          </div>

          <div class="field">
            <label for="fresher-email">Email <span class="required-mark">*</span></label>
            <input id="fresher-email" type="email" name="email" required />
          </div>

          <div class="field">
            <label for="fresher-phone">Phone <span class="required-mark">*</span></label>
            <input id="fresher-phone" type="tel" name="phone" required />
          </div>

          <div class="field">
            <label for="fresher-qualification">Qualification <span class="required-mark">*</span></label>
            <input id="fresher-qualification" type="text" name="qualification" required />
          </div>

          <div class="field">
            <label for="fresher-college">College <span class="required-mark">*</span></label>
            <input id="fresher-college" type="text" name="college" required />
          </div>

          <div class="field">
            <label for="fresher-graduation-year">Graduation Year <span class="required-mark">*</span></label>
            <input id="fresher-graduation-year" type="number" name="graduation_year" min="1950" max="2100" required />
          </div>

          <h3 class="form-section-title">Career Information</h3>
          <div class="field">
            <label for="fresher-job-role">Job Role <span class="required-mark">*</span></label>
            <select id="fresher-job-role" name="job_role" data-options="jobRoles" required><option value="">Select a job role</option></select>
          </div>

          <h3 class="form-section-title">Technical Skills</h3>
          <div class="field full-width">
            <label for="fresher-technical-skills">Programming &amp; Technical Skills <span class="required-mark">*</span></label>
            <select id="fresher-technical-skills" name="skills" data-options="skills" multiple required aria-describedby="skills-help"><option value="">Loading skills...</option></select>
            <small id="skills-help" class="field-help">Hold Ctrl (Windows) or Command (Mac) to select multiple skills.</small>
          </div>

          <h3 class="form-section-title">Job Preferences</h3>
          <div class="field">
            <label for="fresher-preferred-work">Preferred IT Work <span class="required-mark">*</span></label>
            <select id="fresher-preferred-work" name="preferred_work" data-options="preferredWork" required><option value="">Select preferred work</option></select>
          </div>

          <h3 class="form-section-title">Location &amp; Salary</h3>
          <div class="field">
            <label for="fresher-preferred-location">Preferred Location <span class="required-mark">*</span></label>
            <select id="fresher-preferred-location" name="preferred_location" data-options="locations" required><option value="">Select a location</option></select>
          </div>

          <div class="field">
            <label for="fresher-expected-salary">Expected Salary (Per Annum) <span class="required-mark">*</span></label>
            <select id="fresher-expected-salary" name="expected_salary" data-options="salaryRanges" required><option value="">Select expected salary</option></select>
          </div>

          <h3 class="form-section-title">Profile Summary</h3>
          <div class="field full-width">
            <label for="fresher-resume">Resume Summary</label>
            <textarea id="fresher-resume" name="resume" rows="4" placeholder="Briefly describe your profile and resume summary"></textarea>
          </div>
        </div>

        <button type="submit" class="primary-btn">Submit Application</button>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>
    </main>

    <script src="js/dashboard.js"></script>
    <script src="js/application.js"></script>
  </body>
</html>
